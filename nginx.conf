server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 健康检查端点（静态文件，返回纯文本 ok）
    location = /healthz {
        default_type text/plain;
        try_files $uri =404;
    }

    # 带 hash 的构建产物可长期缓存
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    # 单页应用回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
